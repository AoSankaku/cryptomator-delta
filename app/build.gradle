plugins { id 'com.android.application' }
dependencyLocking { lockAllConfigurations() }
android {
    namespace 'org.deltavault.android'
    compileSdk 36
    defaultConfig {
        applicationId 'org.deltavault.android'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '0.5.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    buildTypes {
        release { minifyEnabled false }
    }
    testOptions { unitTests.includeAndroidResources = true }
    buildFeatures { aidl true }
    packaging {
        resources.excludes += ['META-INF/versions/**', 'META-INF/DEPENDENCIES']
        // Keep dependency license notices and cryptolib ServiceLoader registrations in the APK.
        resources.merges += ['META-INF/LICENSE*', 'META-INF/NOTICE*']
    }
}
androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    variant.outputs.each { output ->
        // Keep applicationId lazy so AGP can finish applying variant-specific suffixes.
        output.outputFileName.set(variant.applicationId.map { packageName ->
            "${packageName}-${variant.name}.apk".toString()
        })
    }
}

dependencies {
    implementation project(':core')
    implementation 'org.videolan.android:libvlc-all:3.7.7'
    implementation 'org.aomedia.avif.android:avif:1.3.0.841110fd'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    androidTestImplementation 'junit:junit:4.13.2'
    // Platform test libraries were removed from android.jar; keep them out of the main APK.
    androidTestCompileOnly files("${android.sdkDirectory}/platforms/android-36/optional/android.test.base.jar",
            "${android.sdkDirectory}/platforms/android-36/optional/android.test.runner.jar",
            "${android.sdkDirectory}/platforms/android-36/optional/android.test.mock.jar")
}
